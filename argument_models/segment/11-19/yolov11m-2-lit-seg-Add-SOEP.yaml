# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

# 使用Add_Conv（AC）进行双流融合
# SPDConv和CSPOmniKernel加入到neck的第二大块，用于小目标检测
# 参数量：40220640；计算量：250.7   249.533


#(该模块需要在train.py中关闭amp、
#且在ultralytics/engine/validator.py 115行附近的self.args.half设置为False、跑其余改进记得修改回去！)
#出现这个报错的:RuntimeError: cuFFT error: CUFFT_INTERNAL_ERROR,
#如果你是40系显卡,需要更新torch大于2.0，并且cuda大于12.0.



# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [ 0.50, 0.25, 1024 ]
  s: [ 0.50, 0.50, 1024 ]
  m: [ 0.50, 1.00, 512 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.50, 512 ]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Conv, [ 64, 3, 2 ] ]  # 0-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 1-P2/4
  - [ -1, 2, C3k2, [ 256, True,0.25 ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 3-P3/8
  - [ -1, 2, C3k2, [ 512, True,0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 5-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 7-P5/32
  - [ -1, 2, C3k2, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ] # 9
  - [ -1, 2, C2PSA, [ 1024 ] ] # 10


  - [ -4, 1, Conv, [ 64, 3, 2 ] ]  # 11-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 12-P2/4
  - [ -1, 2, C3k2, [ 256, True,0.25 ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 14-P3/8
  - [ -1, 2, C3k2, [ 512, True,0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 16-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 18-P5/32
  - [ -1, 2, C3k2, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ]   # 20
  - [ -1, 2, C2PSA, [ 1024 ] ] # 21

  # add
  - [ [ 4,15 ], 1, Add, [ 1 ] ] #22
  - [ [ 6,17 ], 1, Add, [ 1 ] ] #23
  - [ [ 10,21 ], 1, Add, [ 1 ] ] #24

# YOLOv8.0n head
head:
  #- [-1, 1, Conv, [512, 1, 1]] #25
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] #25
  - [ [ -1, 23 ], 1, Concat, [ 1 ] ]  # cat backbone P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 27

  #- [-1, 1, Conv, [256, 1, 1]] #28
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] #28
  - [ 2, 1, SPDConv, [ 256 ] ] #29
  - [ [ -1, -2, 22 ], 1, Concat, [ 1 ] ]  # cat backbone P3
  - [ -1, 1, CSPOmniKernel, [ ] ] # 31
  - [ -1, 2, C3k2, [ 256,False ] ]  # 32 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] #33
  - [ [ -1, 27 ], 1, Concat, [ 1 ] ]  # cat head P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 35 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ] #36
  - [ [ -1, 24 ], 1, Concat, [ 1 ] ]  # cat head P5
  - [ -1, 2, C3k2, [ 1024,True ] ]  # 38 (P5/32-large)

  - [ [ 32, 35, 38 ], 1, Segment, [ nc, 32, 256 ] ]  # Segment(P3, P4, P5)


