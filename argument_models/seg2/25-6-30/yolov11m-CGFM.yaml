# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

#v8的scale，backbone中128,256,512等参数不和11的一样，采用的v5的Conv，但是层数29,25添成了28,24。最后是34

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8m-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 355 layers, 2876848 parameters, 2876832 gradients, 10.5 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 355 layers, 10113248 parameters, 10113232 gradients, 35.8 GFLOPs
  m: [0.50, 1.00, 512] # summary: 445 layers, 22420896 parameters, 22420880 gradients, 123.9 GFLOPs
  l: [1.00, 1.00, 512] # summary: 667 layers, 27678368 parameters, 27678352 gradients, 143.0 GFLOPs
  x: [1.00, 1.50, 512] # summary: 667 layers, 62142656 parameters, 62142640 gradients, 320.2 GFLOPs

# YOLOv11.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10


  - [-4, 1, Conv, [64, 3, 2]]  # 11-P1/2
  - [-1, 1, Conv, [ 128, 3, 2]]  # 12-P2/4
  - [-1, 2, C3k2, [ 128, True]]
  - [-1, 1, Conv, [ 256, 3, 2]]  # 14-P3/8
  - [-1, 2, C3k2, [ 256, True]]
  - [-1, 1, Conv, [ 512, 3, 2]]  # 16-P4/16
  - [-1, 2, C3k2, [ 512, True]]
  - [-1, 1, Conv, [ 1024, 3, 2]]  # 18-P5/32
  - [-1, 2, C3k2, [ 1024, True]]
  - [-1, 1, SPPF, [ 1024, 5]]   # 20
  - [-1, 2, C2PSA, [1024]] # 21

  # add
  - [ [ 4,15 ], 1,CGFM, [ ] ] #22
  - [ [ 6,17 ], 1, CGFM, [ ] ] #23
  - [ [ 10,21 ], 1, CGFM, [ ] ] #24

# YOLOv11.0n head
head:
  #- [-1, 1, SEAttention, []] #25
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #25
  - [[-1, 23], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512,False]]  # 27

  # - [-1, 1, SEAttention, []] #29
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #28
  - [[-1, 22], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256,False]]  # 30 (P3/8-small)

  #- [-1, 1, LA, []] #31
  - [-1, 1, Conv, [256, 3, 2]] #31
  - [[-1, 27], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512,False]]  # 33 (P4/16-medium)

  #- [-1, 1, LA, []] #35
  - [-1, 1, Conv, [512, 3, 2]] #34
  - [[-1, 24], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024,True]]  # 36 (P5/32-large)

  - [[30, 33, 36], 1, Segment, [nc, 32, 256]]  # Segment(P3, P4, P5)


