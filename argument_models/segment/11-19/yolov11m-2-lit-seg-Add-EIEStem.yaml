# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

# 使用Add_Conv（AC）进行双流融合
# EIEStem模块替代backbone中的第二层，用于提取图像边缘信息和空间信息。
# 参数量：32792032；计算量：164.996


# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [ 0.50, 0.25, 1024 ]
  s: [ 0.50, 0.50, 1024 ]
  m: [ 0.50, 1.00, 512 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.50, 512 ]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, EIEStem, [ 64, 128 ] ]  # 0-P1/2
  # - [ -1, 1, Conv, [ 128, 3, 2 ] ]
  - [ -1, 2, C3k2, [ 256, True,0.25 ] ]# 1-P2/4
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 2-P3/8
  - [ -1, 2, C3k2, [ 512, True,0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 4-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 6-P5/32
  - [ -1, 2, C3k2, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ] # 8
  - [ -1, 2, C2PSA, [ 1024 ] ] # 9


  - [ -4, 1, EIEStem, [ 64, 128 ] ]  # 10-P1/2
  # - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 12-P2/4
  - [ -1, 2, C3k2, [ 256, True,0.25 ] ]# 11
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 12-P3/8
  - [ -1, 2, C3k2, [ 512, True,0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 14-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 16-P5/32
  - [ -1, 2, C3k2, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ]   # 18
  - [ -1, 2, C2PSA, [ 1024 ] ] # 19

  # add
  - [ [ 3,13 ], 1, Add, [ 1 ] ] #20
  - [ [ 5,15 ], 1, Add, [ 1 ] ] #21
  - [ [ 9,19 ], 1, Add, [ 1 ] ] #22

# YOLOv8.0n head
head:
  #- [-1, 1, Conv, [512, 1, 1]] #25
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] #23
  - [ [ -1, 21 ], 1, Concat, [ 1 ] ]  # cat backbone P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 25

  #- [-1, 1, Conv, [256, 1, 1]] #28
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] #26
  - [ [ -1, 20 ], 1, Concat, [ 1 ] ]  # cat backbone P3
  - [ -1, 2, C3k2, [ 256,False ] ]  # 28 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] #29
  - [ [ -1, 25 ], 1, Concat, [ 1 ] ]  # cat head P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 31 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ] #32
  - [ [ -1, 22 ], 1, Concat, [ 1 ] ]  # cat head P5
  - [ -1, 2, C3k2, [ 1024,True ] ]  # 34 (P5/32-large)

  - [ [ 28, 31, 34 ], 1, Segment, [ nc, 32, 256 ] ]  # Segment(P3, P4, P5)


