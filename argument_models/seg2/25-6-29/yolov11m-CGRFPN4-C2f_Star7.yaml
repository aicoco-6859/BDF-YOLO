# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

# v8的scale，backbone中128,256,512等参数不和11的一样，采用的v5的Conv，但是层数29,25添成了28,24。最后是34
# 针对yolo改进项目中，yolov8CGRFPN项目的双流改进。还有一个是yolov10CGRFPN，两者在backbone出有不同。两者原先都是用于检测。
# 本yaml只改neck部分，backbone部分不改。
# PyramidContextExtraction Module使用金字塔上下文提取模块（PyramidContextExtraction），有效整合不同层级的特征信息，提升模型的上下文感知能力。
# FuseBlockMulti 和 DynamicInterpolationFusion 这些模块用于多尺度特征的融合，通过动态插值和多特征融合，进一步提高了模型的多尺度特征表示能力和提升模型对复杂背景下目标的识别能力。
# PyramidContextExtraction对RGB的P3、P4、P5进行融合
# Depth的P3、P4、P5，每个经过RCM后，再用FuseBlockMulti与融合过的RGB对应P3、P4、P5进行融合

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8m-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [ 0.50, 0.25, 1024 ]
  s: [ 0.50, 0.50, 1024 ]
  m: [ 0.50, 1.00, 512 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.50, 512 ]

# YOLOv11.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 9-P5/32
  - [-1, 2, C2f_Star, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 2, C2PSA, [1024]] # 12

  - [-4, 1, Conv, [64, 3, 2]]  # 13-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 14-P2/4
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 16-P3/8
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 18-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 20-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 22-P5/32
  - [-1, 2, C2f_Star, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 24
  - [-1, 2, C2PSA, [1024]] # 25



# YOLOv11.0n head
head:
  - [[4, 6, 8, 12], 1, PCE4, []] # 26
  - [26, 1, GetIndexOutput, [0]] # 27-P3/8
  - [26, 1, GetIndexOutput, [1]] # 28-P4/16
  - [26, 1, GetIndexOutput, [2]] # 29-P5/32
  - [26, 1, GetIndexOutput, [3]] # 30-P5/32

  - [25, 1, RCM, []] # 31-P5/32
  - [[-1, 30], 1, FuseBlockMulti, []] # 32-P5/32

  - [21, 1, RCM, []] # 33-P4/16
  - [[-1, 32], 1, DynamicInterpolationFusion, []] # 34-P4/16
  - [[-1, 29], 1, FuseBlockMulti, []] # 35-P4/16

  - [19, 1, RCM, []] # 36-P4/16
  - [[-1, 35], 1, DynamicInterpolationFusion, []] # 37-P4/16
  - [[-1, 28], 1, FuseBlockMulti, []] # 38-P4/16

  - [17, 1, RCM, []] # 39-P3/8
  - [[-1, 38], 1, DynamicInterpolationFusion, []] # 40-P3/8
  - [[-1, 27], 1, FuseBlockMulti, []] # 41-P3/8

  - [-1, 1, Conv, [256, 3, 2]] # 42-P4/16
  - [[-1, 38], 1, Concat, [1]] # 43-P4/16
  - [-1, 2, C3k2, [256,False]] # 44-P4/16

  - [-1, 1, Conv, [256, 3, 2]] # 45-P4/16
  - [[-1, 35], 1, Concat, [1]] # 46-P4/16
  - [-1, 2, C3k2, [512,False]] # 47-P4/16

  - [-1, 1, Conv, [512, 3, 2]] # 48-P5/32
  - [[-1, 32], 1, Concat, [1]] # 49-P5/32
  - [-1, 2, C3k2, [1024,True]] # 50-P5/32

  - [[44, 47, 50], 1, Segment, [nc, 32, 256]]  # Segment(P3, P4, P5)

