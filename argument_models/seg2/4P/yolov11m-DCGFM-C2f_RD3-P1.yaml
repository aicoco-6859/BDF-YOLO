# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

#v8的scale，backbone中128,256,512等参数不和11的一样，采用的v5的Conv，但是层数29,25添成了28,24。最后是34

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8m-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv11.0n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-4, 1, Conv, [64, 3, 2]]  # 1-P1/2

  # DCFM
  - [ [ 0,1 ], 1,DCGFM, [ ] ] #2
  - [-1, 1, Conv, [128, 3, 2]]  # 3-P2/4
  - [-1, 2, C3k2, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 5-P3/8
  - [-1, 2, C3k2, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]]  # 7-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]]  # 9-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 11
  - [-1, 2, C2PSA, [1024]] # 12

# YOLOv11.0n head
head:
  #- [-1, 1, SEAttention, []] #25
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #13
  - [[-1, 8], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512,False]]  # 15

  # - [-1, 1, SEAttention, []] #29
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] #16
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256,False]]  # 18 (P3/8-small)

  #- [-1, 1, LA, []] #19
  - [-1, 1, Conv, [256, 3, 2]] #19
  - [[-1, 15], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2, [512,False]]  # 21 (P4/16-medium)

  #- [-1, 1, LA, []] #23
  - [-1, 1, Conv, [512, 3, 2]] #22
  - [[-1, 12], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2, [1024,True]]  # 24 (P5/32-large)

  - [[18, 21, 24], 1, Segment, [nc, 32, 256]]  # Segment(P3, P4, P5)

