# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

# 参数量：32773088；计算量：163.5   162.558

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [ 0.50, 0.25, 1024 ]
  s: [ 0.50, 0.50, 1024 ]
  m: [ 0.50, 1.00, 512 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.50, 512 ]

# YOLOv11.0n backbone
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Conv, [ 64, 3, 2 ] ]  # 0-P1/2 rgb
  - [ -4, 1, Conv, [ 64, 3, 2 ] ]  # 1-d
  - [ [ -1, 0 ], 1, ResidualExciteFusion, [ 1 ] ] # 2

  - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 3-rgb
  - [ -2, 1, Conv, [ 128, 3, 2 ] ]  # 4-d
  - [ [ -1,3 ], 1, ResidualExciteFusion, [ 1 ] ] # 5

  - [ -1, 2, C3k2, [ 256, True,0.25 ] ] # 6-rgb
  - [ -2, 2, C3k2, [ 256, True,0.25 ] ] # 7-d
  - [ [ -1,6 ], 1, ResidualExciteFusion, [ 1 ] ] # 8

  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 9-rgb
  - [ -2, 1, Conv, [ 256, 3, 2 ] ]  # 10-d
  - [ [ -1,9 ], 1, ResidualExciteFusion, [ 1 ] ] # 11

  - [ -1, 2, C3k2, [ 512, True,0.25 ] ] # 12
  - [ -2, 2, C3k2, [ 512, True,0.25 ] ] # 13
  - [ [ -1,12 ], 1, ResidualExciteFusion, [ 1 ] ] # 14

  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 15-rgb
  - [ -2, 1, Conv, [ 512, 3, 2 ] ]  # 16-d
  - [ [ -1,15 ], 1, ResidualExciteFusion, [ 1 ] ] # 17

  - [ -1, 2, C3k2, [ 512, True ] ] # 18-rgb
  - [ -2, 2, C3k2, [ 512, True ] ] # 19-d
  - [ [ -1,18 ], 1, ResidualExciteFusion, [ 1 ] ] # 20

  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 21-rgb
  - [ -2, 1, Conv, [ 1024, 3, 2 ] ]  # 22-d
  - [ [ -1,21 ], 1, ResidualExciteFusion, [ 1 ] ] # 23

  - [ -1, 2, C3k2, [ 1024, True ] ] # 24
  - [ -2, 2, C3k2, [ 1024, True ] ] # 25
  - [ [ -1,24 ], 1, ResidualExciteFusion, [ 1 ] ] # 26

  - [ -1, 1, SPPF, [ 1024, 5 ] ]  # 27
  - [ -2, 1, SPPF, [ 1024, 5 ] ]  # 28
  - [ [ -1,27 ], 1, ResidualExciteFusion, [ 1 ] ] # 29

  - [ -1, 2, C2PSA, [ 1024 ] ] # 30
  - [ -2, 2, C2PSA, [ 1024 ] ] # 31
  - [ [ -1,30 ], 1, ResidualExciteFusion, [ 1 ] ] # 32

# YOLOv8.0n head
head:
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] # 33
  - [ [ -1, 20 ], 1, Concat, [ 1 ] ]  # cat backbone P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 35

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] # 36
  - [ [ -1, 14 ], 1, Concat, [ 1 ] ]  # cat backbone P3
  - [ -1, 2, C3k2, [ 256,False ] ]  # 38 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 39
  - [ [ -1, 35 ], 1, Concat, [ 1 ] ]  # cat head P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 41 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 42
  - [ [ -1, 32 ], 1, Concat, [ 1 ] ]  # cat head P5
  - [ -1, 2, C3k2, [ 1024,True ] ]  # 44 (P5/32-large)

  - [ [ 38, 41, 44 ], 1, Segment, [ nc, 32, 256 ] ]  # Segment(P3, P4, P5)

