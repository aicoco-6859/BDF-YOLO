# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

# 参数量：32773088；计算量：163.5   162.558

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [ 0.50, 0.25, 1024 ]
  s: [ 0.50, 0.50, 1024 ]
  m: [ 0.50, 1.00, 512 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.50, 512 ]

# YOLOv11.0n backbone
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Conv, [ 64, 3, 2 ] ]  # 0-P1/2 rgb
  - [ -4, 1, Conv, [ 64, 3, 2 ] ]  # 1-d
  - [ [ 1, 0 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 2
  - [ [ 1, 0 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 3

  - [ 2, 1, Conv, [ 128, 3, 2 ] ]  # 4-rgb
  - [ 3, 1, Conv, [ 128, 3, 2 ] ]  # 5-d
  - [ [ 5, 4 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 6
  - [ [ 5, 4 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 7

  - [ 6, 3, C3k2, [ 256, True,0.25 ] ] # 8-rgb
  - [ 7, 3, C3k2, [ 256, True,0.25 ] ] # 9-d
  - [ [ 9,8 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 10
  - [ [ 9,8 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 11

  - [ 10, 1, Conv, [ 256, 3, 2 ] ]  # 12-rgb
  - [ 11, 1, Conv, [ 256, 3, 2 ] ]  # 13-d
  - [ [ 13,12 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 14
  - [ [ 13,12 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 15

  - [ 14, 6, C3k2, [ 512, True,0.25 ] ] # 16
  - [ 15, 6, C3k2, [ 512, True,0.25 ] ] # 17
  - [ [ 17,16 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 18
  - [ [ 17,16 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 19

  - [ 18, 1, Conv, [ 512, 3, 2 ] ]  # 20-rgb
  - [ 19, 1, Conv, [ 512, 3, 2 ] ]  # 21-d
  - [ [ 21,20 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 22
  - [ [ 21,20 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 23

  - [ 22, 6, C3k2, [ 512, True ] ] # 24-rgb
  - [ 23, 6, C3k2, [ 512, True ] ] # 25-d
  - [ [ 25,24 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 26
  - [ [ 25,24 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 27

  - [ 26, 1, Conv, [ 1024, 3, 2 ] ]  # 28-rgb
  - [ 27, 1, Conv, [ 1024, 3, 2 ] ]  # 29-d
  - [ [ 29,28 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 30
  - [ [ 29,28 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 31

  - [ 30, 3, C3k2, [ 1024, True ] ] # 32
  - [ 31, 3, C3k2, [ 1024, True ] ] # 33
  - [ [ 33,32 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 34
  - [ [ 33,32 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 35

  - [ 34, 1, SPPF, [ 1024, 5 ] ]  # 36
  - [ 35, 1, SPPF, [ 1024, 5 ] ]  # 37
  - [ [ 37,36 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 38
  - [ [ 37,36 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 39

  - [ 38, 2, C2PSA, [ 1024 ] ] # 40
  - [ 39, 2, C2PSA, [ 1024 ] ] # 41
  - [ [ 41,40 ], 1, ResidualExciteFusion_rgb, [ 1 ] ] # 42
  - [ [ 41,40 ], 1, ResidualExciteFusion_depth, [ 1 ] ] # 43

# Fusion
  - [ [ 18,19 ], 1, Add, [ 1 ] ] #44
  - [ [ 26,27 ], 1, Add, [ 1 ] ] #45
  - [ [ 42,43 ], 1, Add, [ 1 ] ] #46


# YOLOv8.0n head
head:
  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] # 47
  - [ [ -1, 45 ], 1, Concat, [ 1 ] ]  # cat backbone P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 49

  - [ -1, 1, nn.Upsample, [ None, 2, 'nearest' ] ] # 50
  - [ [ -1, 44 ], 1, Concat, [ 1 ] ]  # cat backbone P3
  - [ -1, 2, C3k2, [ 256,False ] ]  # 52 (P3/8-small)

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] # 53
  - [ [ -1, 49 ], 1, Concat, [ 1 ] ]  # cat head P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 55 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ] # 56
  - [ [ -1, 46 ], 1, Concat, [ 1 ] ]  # cat head P5
  - [ -1, 2, C3k2, [ 1024,True ] ]  # 58 (P5/32-large)

  - [ [ 52, 55, 58 ], 1, Segment, [ nc, 32, 256 ] ]

