# Ultralytics YOLO 🚀, AGPL-3.0 license
# YOLOv8-seg instance segmentation model. For Usage examples see https://docs.ultralytics.com/tasks/segment

# 使用Add_Conv（AC）进行双流融合
# PyramidContextExtraction Module使用金字塔上下文提取模块（PyramidContextExtraction），有效整合不同层级的特征信息，提升模型的上下文感知能力。
# FuseBlockMulti 和 DynamicInterpolationFusion 这些模块用于多尺度特征的融合，通过动态插值和多特征融合，进一步提高了模型的多尺度特征表示能力和提升模型对复杂背景下目标的识别能力。
# 参数量：41864416；计算量：216.8   215.272

# Parameters
nc: 80  # number of classes
scales: # model compound scaling constants, i.e. 'model=yolov8n-seg.yaml' will call yolov8-seg.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [ 0.50, 0.25, 1024 ]
  s: [ 0.50, 0.50, 1024 ]
  m: [ 0.50, 1.00, 512 ]
  l: [ 1.00, 1.00, 512 ]
  x: [ 1.00, 1.50, 512 ]

# YOLOv8.0n backbone
backbone:
  # [from, repeats, module, args]
  - [ -1, 1, Conv, [ 64, 3, 2 ] ]  # 0-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 1-P2/4
  - [ -1, 2, C3k2, [ 256, True,0.25 ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 3-P3/8
  - [ -1, 2, C3k2, [ 512, True,0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 5-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 7-P5/32
  - [ -1, 2, C3k2, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ] # 9
  - [ -1, 2, C2PSA, [ 1024 ] ] # 10


  - [ -4, 1, Conv, [ 64, 3, 2 ] ]  # 11-P1/2
  - [ -1, 1, Conv, [ 128, 3, 2 ] ]  # 12-P2/4
  - [ -1, 2, C3k2, [ 256, True,0.25 ] ]
  - [ -1, 1, Conv, [ 256, 3, 2 ] ]  # 14-P3/8
  - [ -1, 2, C3k2, [ 512, True,0.25 ] ]
  - [ -1, 1, Conv, [ 512, 3, 2 ] ]  # 16-P4/16
  - [ -1, 2, C3k2, [ 512, True ] ]
  - [ -1, 1, Conv, [ 1024, 3, 2 ] ]  # 18-P5/32
  - [ -1, 2, C3k2, [ 1024, True ] ]
  - [ -1, 1, SPPF, [ 1024, 5 ] ]   # 20
  - [ -1, 2, C2PSA, [ 1024 ] ] # 21

  # add
  - [ [ 4,15 ], 1, Add, [ 1 ] ] #22
  - [ [ 6,17 ], 1, Add, [ 1 ] ] #23
  - [ [ 10,21 ], 1, Add, [ 1 ] ] #24

# YOLOv8.0n head
head:
  - [[22, 23, 24], 1, PyramidContextExtraction, []] # 25
  - [25, 1, GetIndexOutput, [0]] # 26-P3/8
  - [25, 1, GetIndexOutput, [1]] # 27-P4/16
  - [25, 1, GetIndexOutput, [2]] # 28-P5/32

  - [24, 1, RCM, []] # 29-P5/32
  - [[-1, 28], 1, FuseBlockMulti, []] # 30-P5/32

  - [23, 1, RCM, []] # 31-P4/16
  - [[-1, 30], 1, DynamicInterpolationFusion, []] # 32-P4/16
  - [[-1, 27], 1, FuseBlockMulti, []] # 33-P4/16

  - [22, 1, RCM, []] # 34-P3/8
  - [[-1, 33], 1, DynamicInterpolationFusion, []] # 35-P3/8
  - [[-1, 26], 1, FuseBlockMulti, []] # 36-P3/8

  - [ -1, 1, Conv, [ 256, 3, 2 ] ] #37
  - [ [ -1, 33 ], 1, Concat, [ 1 ] ]  # cat head P4
  - [ -1, 2, C3k2, [ 512,False ] ]  # 39 (P4/16-medium)

  - [ -1, 1, Conv, [ 512, 3, 2 ] ] #40
  - [ [ -1, 30 ], 1, Concat, [ 1 ] ]  # cat head P5
  - [ -1, 2, C3k2, [ 1024,True ] ]  # 42 (P5/32-large)

  - [ [ 36, 39, 42 ], 1, Segment, [ nc, 32, 256 ] ]  # Segment(P3, P4, P5)


